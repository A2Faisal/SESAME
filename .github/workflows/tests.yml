name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # actions/setup-python (all current majors) emits a Node-level `punycode`
  # deprecation warning on Ubuntu runners. This is an open upstream issue
  # (actions/setup-python#1208, #1252), not something fixable from this
  # workflow, so it is suppressed here rather than left as noise.
  NODE_OPTIONS: --no-deprecation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # SESAME depends on geopandas/rasterio/cartopy, which need GDAL, GEOS,
      # and PROJ system libraries. This mirrors the README's conda-based
      # install instructions, but via apt since this job doesn't use conda.
      - name: Install system geospatial libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev gdal-bin proj-bin libproj-dev libgeos-dev

      - name: Install SESAME and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check src/

      - name: Run tests
        working-directory: test
        run: pytest test_core.py -v
