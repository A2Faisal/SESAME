name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # SESAME depends on geopandas/rasterio/cartopy, which need GDAL, GEOS,
      # and PROJ system libraries. This mirrors the README's conda-based
      # install instructions, but via apt since this job doesn't use conda.
      - name: Install system geospatial libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev gdal-bin proj-bin libproj-dev libgeos-dev

      - name: Install SESAME and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Run tests
        working-directory: test
        run: pytest test_core.py -v
