[tool.poetry]
name = "sesame-iesd"
version = "1.0.2"
description = "A simple Python package for SESAME toolbox"
authors = [
    "Abdullah Al Faisal <abdullah.al.faisal@mail.mcgill.ca>",
    "Maxwell Kaye <maxwell.kaye@mail.mcgill.ca>"
]
license = "MIT"
readme = "README.md"
packages = [{include = "sesame", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9.24"
geopandas = "^1.0.1"
xarray = "^2024.6.0"
h5netcdf = "^1.3.0"
h5py = "^3.11.0"
rasterio = "^1.3.10"
matplotlib = "^3.9.1"
seaborn = "^0.13.2"
scipy = "^1.14.0"
cartopy = "^0.23.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Default rule set (E4, E7, E9, F) plus unused-import/variable checks.
# NOTE: the existing codebase does not pass this yet (tracked separately,
# see issue for the pre-existing findings). Run `ruff check .` locally to
# see current violations; this section defines the target, not yet a CI gate.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
